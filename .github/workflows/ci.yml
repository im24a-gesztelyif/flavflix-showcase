name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Build with placeholder configuration
        env:
          TMDB_READ_TOKEN: test-token
          OMDB_API_KEY: test-key
          NEXT_PUBLIC_TMDB_LANGUAGE: en-US
          NEXT_PUBLIC_TMDB_REGION: US
        run: npm run build
